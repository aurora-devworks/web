<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Map Editor</title>

<style>

*{
    box-sizing:border-box;
    touch-action: none; /* Prevents mobile browser scrolling while dragging/drawing */
}

body{
    margin:0;
    background:#222;
    font-family:Arial,sans-serif;
    overflow: hidden;
}

.toolbar{
    height:60px;
    background:#333;
    color:white;

    display:flex;
    align-items:center;
    gap:15px;

    padding:0 15px;
}

button{
    padding:8px 14px;
    cursor:pointer;
}

#drawLineBtn.active{
    background:limegreen;
    color:black;
}

.app{
    display:flex;
    height:calc(100vh - 60px);
    padding:16px;
    gap:16px;
}

#board{
    flex:1;
    position:relative;
    overflow:hidden;

    background:white;
    border:2px solid #666;

    background-image:
        linear-gradient(#ddd 1px, transparent 1px),
        linear-gradient(90deg,#ddd 1px,transparent 1px);

    background-size:50px 50px;
}

#lineLayer{
    position:absolute;
    inset:0;
    z-index:1;
    width:100%;
    height:100%;
}

#iconLayer{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events: none;
}

.sidebar{
    width:180px;

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    overflow-y:auto;
    touch-action: pan-y;
}

.palette-icon{
    width:75px;
    height:75px;
    background:#444;
    background-size:contain;
    background-position:center;
    background-repeat:no-repeat;
    border:2px solid #555;
    cursor:grab;
    user-select: none;
    -webkit-user-drag: element;
    border-radius: 6px;
}

.tile{
    position:absolute;

    width:50px;
    height:50px;

    background-size:contain;
    background-position:center;
    background-repeat:no-repeat;

    cursor:move;

    transform-origin:center center;
    pointer-events: auto;
}

.tile.selected{
    outline:3px solid dodgerblue;
}

.line-handle{
    fill:dodgerblue;
    stroke:white;
    stroke-width:2;
    display:none;
    cursor:pointer;
}

</style>
</head>
<body>

<div class="toolbar">

    <button id="drawLineBtn">
        Draw Line
    </button>

    <button id="deleteLineBtn">
        Delete Line
    </button>

    <label>
        Color
        <input
            id="lineColor"
            type="color"
            value="#ff0000">
    </label>

    <label>
        Thickness
        <input
            id="lineWidth"
            type="range"
            min="1"
            max="12"
            value="3">
    </label>

</div>

<div class="app">

    <div id="board">

        <svg id="lineLayer"></svg>

        <div id="iconLayer"></div>

    </div>

    <div id="sidebar" class="sidebar"></div>

</div>

<script>

const SVG_NS = "http://www.w3.org/2000/svg";
const GRID = 50;

const board = document.getElementById("board");
const iconLayer = document.getElementById("iconLayer");
const lineLayer = document.getElementById("lineLayer");
const sidebar = document.getElementById("sidebar");

const drawLineBtn = document.getElementById("drawLineBtn");
const deleteLineBtn = document.getElementById("deleteLineBtn");
const lineColor = document.getElementById("lineColor");
const lineWidth = document.getElementById("lineWidth");

let drawMode = false;

let selectedTile = null;
let selectedLine = null;

let drawingLine = false;
let previewLine = null;

let draggedIconSrc = null;

// Items list
const itemNames = [
    "Jammer",               // 01
    "Connector",            // 02
    "Stationary Connector", // 03
    "Cube",                 // 04
    "Fan",                  // 05
    "RGB Converter",        // 06
    "Driller",              // 07
    "Inverter",             // 08
    "Clone",                // 09
    "Accumulator",          // 10
    "Swapper",              // 11
    "Teleporter",           // 12
    "Gravshifter",          // 13
    "Rover",                // 14
    "Activator",            // 15
    "Tetromino"             // 16
];

// Generates SVG Icon with larger text and no numbers
function generateIconUri(index, name) {
    const colors = ["#e74c3c", "#3498db", "#2ecc71", "#f1c40f", "#9b59b6", "#e67e22", "#1abc9c", "#34495e"];
    const bg = colors[(index - 1) % colors.length];
    
    // Split multi-word names for clean multi-line display
    const words = name.split(" ");
    let textSvg = "";
    if (words.length > 1) {
        textSvg = `<text x="50%" y="38%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">${words[0]}</text>
                   <text x="50%" y="62%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">${words[1]}</text>`;
    } else {
        textSvg = `<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif">${name}</text>`;
    }

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80">
        <rect width="80" height="80" rx="10" fill="${bg}"/>
        ${textSvg}
    </svg>`;
    
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

function snap(value){
    return Math.round(value / GRID) * GRID;
}

function getPointerPos(event) {
    if (event.touches && event.touches.length > 0) {
        return { clientX: event.touches[0].clientX, clientY: event.touches[0].clientY };
    }
    if (event.changedTouches && event.changedTouches.length > 0) {
        return { clientX: event.changedTouches[0].clientX, clientY: event.changedTouches[0].clientY };
    }
    return { clientX: event.clientX, clientY: event.clientY };
}

function boardPosition(event){
    const rect = board.getBoundingClientRect();
    const pos = getPointerPos(event);
    return {
        x: snap(pos.clientX - rect.left),
        y: snap(pos.clientY - rect.top)
    };
}

/* ==========================
   DESELECT
========================== */

function deselectEverything(){

    document.querySelectorAll(".tile").forEach(tile=>{
        tile.classList.remove("selected");
    });

    if(selectedLine){
        selectedLine.line.setAttribute("stroke", selectedLine.color);
        selectedLine.line.setAttribute("stroke-width", selectedLine.width);
        selectedLine.startHandle.style.display = "none";
        selectedLine.endHandle.style.display = "none";
    }

    selectedTile = null;
    selectedLine = null;
}

/* ==========================
   ICONS / PALETTE
========================== */

itemNames.forEach((name, idx) => {
    const iconSrc = generateIconUri(idx + 1, name);

    const iconDiv = document.createElement("div");
    iconDiv.className = "palette-icon";
    iconDiv.draggable = true;
    iconDiv.style.backgroundImage = `url('${iconSrc}')`;
    iconDiv.title = name;

    // Desktop Drag Start
    iconDiv.addEventListener("dragstart", e => {
        e.dataTransfer.setData("iconSrc", iconSrc);
    });

    // Touch Drag Start (Mobile / Tablet)
    iconDiv.addEventListener("touchstart", e => {
        draggedIconSrc = iconSrc;
    }, { passive: true });

    sidebar.appendChild(iconDiv);
});

// Canvas Drag / Drop Handlers (Desktop)
board.addEventListener("dragover", e => e.preventDefault());

board.addEventListener("drop", e => {
    e.preventDefault();
    const iconSrc = e.dataTransfer.getData("iconSrc");
    if(!iconSrc) return;

    const p = boardPosition(e);
    createTile(p.x, p.y, iconSrc);
});

// Canvas Touch Drop Handler (Tablet)
document.addEventListener("touchend", e => {
    if(!draggedIconSrc) return;
    
    const pos = getPointerPos(e);
    const rect = board.getBoundingClientRect();

    if (
        pos.clientX >= rect.left &&
        pos.clientX <= rect.right &&
        pos.clientY >= rect.top &&
        pos.clientY <= rect.bottom
    ) {
        const p = boardPosition(e);
        createTile(p.x, p.y, draggedIconSrc);
    }
    draggedIconSrc = null;
});

function createTile(x, y, src){

    const tile = document.createElement("div");
    tile.className = "tile";
    tile.style.left = x + "px";
    tile.style.top = y + "px";
    tile.style.backgroundImage = `url('${src}')`;
    tile.dataset.rotation = 0;
    tile.dataset.scale = 1;

    iconLayer.appendChild(tile);
    enableTile(tile);
}

function enableTile(tile){

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    tile.addEventListener("click", e => {
        e.stopPropagation();
        deselectEverything();
        selectedTile = tile;
        tile.classList.add("selected");
    });

    const startDrag = (e) => {
        if(drawMode) return;
        dragging = true;
        deselectEverything();
        selectedTile = tile;
        tile.classList.add("selected");

        const pos = getPointerPos(e);
        offsetX = pos.clientX - tile.offsetLeft;
        offsetY = pos.clientY - tile.offsetTop;
        e.stopPropagation();
    };

    tile.addEventListener("mousedown", startDrag);
    tile.addEventListener("touchstart", startDrag, { passive: false });

    const moveDrag = (e) => {
        if(!dragging) return;
        if(e.cancelable) e.preventDefault();
        const pos = getPointerPos(e);
        tile.style.left = (pos.clientX - offsetX) + "px";
        tile.style.top = (pos.clientY - offsetY) + "px";
    };

    document.addEventListener("mousemove", moveDrag);
    document.addEventListener("touchmove", moveDrag, { passive: false });

    const stopDrag = () => {
        if(!dragging) return;
        dragging = false;
        tile.style.left = snap(parseInt(tile.style.left)) + "px";
        tile.style.top = snap(parseInt(tile.style.top)) + "px";
    };

    document.addEventListener("mouseup", stopDrag);
    document.addEventListener("touchend", stopDrag);

    tile.addEventListener("wheel", e => {
        if(tile !== selectedTile) return;
        e.preventDefault();
        let scale = parseFloat(tile.dataset.scale);
        scale += e.deltaY > 0 ? -0.1 : 0.1;
        scale = Math.max(0.5, Math.min(3, scale));
        tile.dataset.scale = scale;
        updateTile(tile);
    });
}

function updateTile(tile){
    tile.style.transform = `rotate(${tile.dataset.rotation}deg) scale(${tile.dataset.scale})`;
}

/* ==========================
   DRAW LINE MODE
========================== */

drawLineBtn.addEventListener("click", () => {
    drawMode = !drawMode;
    drawLineBtn.classList.toggle("active", drawMode);
});

const handleLineStart = (e) => {
    if(!drawMode) return;
    if(e.target === iconLayer) return;

    const p = boardPosition(e);
    drawingLine = true;

    previewLine = document.createElementNS(SVG_NS, "line");
    previewLine.setAttribute("x1", p.x);
    previewLine.setAttribute("y1", p.y);
    previewLine.setAttribute("x2", p.x);
    previewLine.setAttribute("y2", p.y);
    previewLine.setAttribute("stroke", lineColor.value);
    previewLine.setAttribute("stroke-width", lineWidth.value);

    lineLayer.appendChild(previewLine);
};

board.addEventListener("mousedown", handleLineStart);
board.addEventListener("touchstart", handleLineStart, { passive: false });

const handleLineMove = (e) => {
    if(!drawingLine) return;
    if(e.cancelable) e.preventDefault();
    const p = boardPosition(e);
    previewLine.setAttribute("x2", p.x);
    previewLine.setAttribute("y2", p.y);
};

board.addEventListener("mousemove", handleLineMove);
board.addEventListener("touchmove", handleLineMove, { passive: false });

const handleLineEnd = () => {
    if(!drawingLine) return;
    drawingLine = false;

    const x1 = Number(previewLine.getAttribute("x1"));
    const y1 = Number(previewLine.getAttribute("y1"));
    const x2 = Number(previewLine.getAttribute("x2"));
    const y2 = Number(previewLine.getAttribute("y2"));

    previewLine.remove();

    if (x1 !== x2 || y1 !== y2) {
        createLineGroup(x1, y1, x2, y2);
    }
};

document.addEventListener("mouseup", handleLineEnd);
document.addEventListener("touchend", handleLineEnd);

/* ==========================
   LINE GROUPS
========================== */

function createHandle(x, y){
    const c = document.createElementNS(SVG_NS, "circle");
    c.setAttribute("cx", x);
    c.setAttribute("cy", y);
    c.setAttribute("r", 12);
    c.classList.add("line-handle");
    return c;
}

function updateGroupPosition(obj, x1, y1, x2, y2){
    [obj.hitbox, obj.line].forEach(item => {
        item.setAttribute("x1", x1);
        item.setAttribute("y1", y1);
        item.setAttribute("x2", x2);
        item.setAttribute("y2", y2);
    });

    obj.startHandle.setAttribute("cx", x1);
    obj.startHandle.setAttribute("cy", y1);
    obj.endHandle.setAttribute("cx", x2);
    obj.endHandle.setAttribute("cy", y2);
}

function createLineGroup(x1, y1, x2, y2){
    const group = document.createElementNS(SVG_NS, "g");
    const hitbox = document.createElementNS(SVG_NS, "line");
    const line = document.createElementNS(SVG_NS, "line");

    hitbox.setAttribute("stroke", "transparent");
    hitbox.setAttribute("stroke-width", "24");
    hitbox.setAttribute("cursor", "pointer");

    line.setAttribute("stroke", lineColor.value);
    line.setAttribute("stroke-width", lineWidth.value);
    line.setAttribute("stroke-linecap", "round");

    const startHandle = createHandle(x1, y1);
    const endHandle = createHandle(x2, y2);

    updateGroupPosition({ hitbox, line, startHandle, endHandle }, x1, y1, x2, y2);

    group.appendChild(hitbox);
    group.appendChild(line);
    group.appendChild(startHandle);
    group.appendChild(endHandle);

    lineLayer.appendChild(group);

    const obj = {
        group,
        hitbox,
        line,
        startHandle,
        endHandle,
        color: lineColor.value,
        width: lineWidth.value
    };

    enableLineSelection(obj);
    enableLineMove(obj);
    enableHandleMove(obj);

    return obj;
}

/* ==========================
   LINE SELECT
========================== */

function selectLine(obj){
    deselectEverything();
    selectedLine = obj;

    obj.line.setAttribute("stroke", "dodgerblue");
    obj.line.setAttribute("stroke-width", Number(obj.width) + 2);
    obj.startHandle.style.display = "block";
    obj.endHandle.style.display = "block";
}

function enableLineSelection(obj){
    obj.hitbox.addEventListener("click", e => {
        e.stopPropagation();
        selectLine(obj);
    });
}

/* ==========================
   MOVE WHOLE LINE
========================== */

function enableLineMove(obj){
    let dragging = false;
    let startMouseX, startMouseY;
    let x1, y1, x2, y2;

    const startMove = (e) => {
        if(drawMode) return;
        selectLine(obj);
        dragging = true;

        const pos = getPointerPos(e);
        startMouseX = pos.clientX;
        startMouseY = pos.clientY;

        x1 = Number(obj.line.getAttribute("x1"));
        y1 = Number(obj.line.getAttribute("y1"));
        x2 = Number(obj.line.getAttribute("x2"));
        y2 = Number(obj.line.getAttribute("y2"));

        e.stopPropagation();
    };

    obj.hitbox.addEventListener("mousedown", startMove);
    obj.hitbox.addEventListener("touchstart", startMove, { passive: false });

    const moveLine = (e) => {
        if(!dragging) return;
        if(e.cancelable) e.preventDefault();
        const pos = getPointerPos(e);
        const dx = pos.clientX - startMouseX;
        const dy = pos.clientY - startMouseY;

        updateGroupPosition(obj, x1 + dx, y1 + dy, x2 + dx, y2 + dy);
    };

    document.addEventListener("mousemove", moveLine);
    document.addEventListener("touchmove", moveLine, { passive: false });

    const endMove = () => {
        if(!dragging) return;
        dragging = false;

        updateGroupPosition(
            obj,
            snap(Number(obj.line.getAttribute("x1"))),
            snap(Number(obj.line.getAttribute("y1"))),
            snap(Number(obj.line.getAttribute("x2"))),
            snap(Number(obj.line.getAttribute("y2")))
        );
    };

    document.addEventListener("mouseup", endMove);
    document.addEventListener("touchend", endMove);
}

/* ==========================
   HANDLE DRAGGING
========================== */

function enableHandleMove(obj){
    createHandleDrag(obj, obj.startHandle, "start");
    createHandleDrag(obj, obj.endHandle, "end");
}

function createHandleDrag(obj, handle, type){
    const startHandleDrag = (e) => {
        e.stopPropagation();

        function move(ev){
            if(ev.cancelable) ev.preventDefault();
            const p = boardPosition(ev);
            let x1 = Number(obj.line.getAttribute("x1"));
            let y1 = Number(obj.line.getAttribute("y1"));
            let x2 = Number(obj.line.getAttribute("x2"));
            let y2 = Number(obj.line.getAttribute("y2"));

            if(type === "start"){
                x1 = p.x;
                y1 = p.y;
            } else {
                x2 = p.x;
                y2 = p.y;
            }

            updateGroupPosition(obj, x1, y1, x2, y2);
        }

        function up(){
            document.removeEventListener("mousemove", move);
            document.removeEventListener("touchmove", move);
            document.removeEventListener("mouseup", up);
            document.removeEventListener("touchend", up);
        }

        document.addEventListener("mousemove", move);
        document.addEventListener("touchmove", move, { passive: false });
        document.addEventListener("mouseup", up);
        document.addEventListener("touchend", up);
    };

    handle.addEventListener("mousedown", startHandleDrag);
    handle.addEventListener("touchstart", startHandleDrag, { passive: false });
}

/* ==========================
   DELETE & ROTATE
========================== */

deleteLineBtn.addEventListener("click", () => {
    if(selectedLine){
        selectedLine.group.remove();
        selectedLine = null;
    }
});

document.addEventListener("keydown", e => {
    if(e.key === "Delete"){
        if(selectedTile){
            selectedTile.remove();
            selectedTile = null;
        }
        if(selectedLine){
            selectedLine.group.remove();
            selectedLine = null;
        }
    }

    if(e.key.toLowerCase() === "r" && selectedTile){
        let rotation = Number(selectedTile.dataset.rotation);
        rotation += 90;
        selectedTile.dataset.rotation = rotation;
        updateTile(selectedTile);
    }
});

board.addEventListener("click", () => {
    if(!drawMode){
        deselectEverything();
    }
});

</script>

</body>
</html>
